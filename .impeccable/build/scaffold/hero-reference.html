<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: manual-02-indice.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin+Condensed:wght@700&family=Edu+AU+VIC+WA+NT+Arrows:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#e7dccf}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:941px">
  <div class="r-manual region chrome" data-region="manual"><!-- One continuous ivory manual page enclosed by a blue binding rim; physical book structure behind all named children. --></div>
  <div class="r-paper region texture" data-region="paper" style="background-image:url('../../../assets/plates/paper.png');background-repeat:repeat"></div>
  <figure class="r-brand region plate" data-region="brand"><img src="../../../assets/plates/brand.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-heading region text" data-region="heading"><!-- Centro de juegos; handwritten blue ink. --><p style="font-size:var(--r-heading-font);line-height:1.05;margin:0">heading</p></div>
  <div class="r-header-left region text" data-region="header-left"><!-- BUENAS PREGUNTAS GRANDES HISTORIAS; blue handwritten marginal note. --><p style="line-height:1.05;margin:0">header-left</p></div>
  <div class="r-header-right region text" data-region="header-right"><!-- IDEAS JUEGOS PERSONAS UN MUNDO MEJOR; blue handwritten marginal note. --><p style="line-height:1.05;margin:0">header-right</p></div>
  <div class="r-underline region chrome" data-region="underline"><!-- Short yellow underline below the page heading. --></div>
  <figure class="r-ring region plate" data-region="ring"><img src="../../../assets/plates/ring.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-divider-0 region chrome" data-region="divider-0"><!-- One yellow index strip, rounded trailing edge; selected strip advances left. --></div>
  <div class="r-game-0 region text" data-region="game-0"><!-- Jeopardy; selectable game name with a coherent icon on its left. --><p style="line-height:1.05;margin:0">game-0</p></div>
  <div class="r-status-0 region text" data-region="status-0"><!-- Próximamente; status of the game. --><p style="font-size:var(--r-status-0-font);line-height:1.05;margin:0">status-0</p></div>
  <div class="r-divider-1 region chrome" data-region="divider-1"><!-- One orange index strip, rounded trailing edge; selected strip advances left. --></div>
  <div class="r-game-1 region text" data-region="game-1"><!-- ¿Versículo o inventículo?; selectable game name with a coherent icon on its left. --><p style="font-size:var(--r-game-1-font);font-family:var(--r-game-1-family),sans-serif;font-weight:var(--r-game-1-weight);line-height:1.05;margin:0">game-1</p></div>
  <div class="r-status-1 region text" data-region="status-1"><!-- Próximamente; status of the game. --><p style="font-size:var(--r-status-1-font);line-height:1.05;margin:0">status-1</p></div>
  <div class="r-divider-2 region chrome" data-region="divider-2"><!-- One turquoise index strip, rounded trailing edge; selected strip advances left. --></div>
  <div class="r-game-2 region text" data-region="game-2"><!-- El discípulo más perdido; selectable game name with a coherent icon on its left. --><p style="font-size:var(--r-game-2-font);line-height:1.05;margin:0">game-2</p></div>
  <div class="r-status-2 region text" data-region="status-2"><!-- Próximamente; status of the game. --><p style="font-size:var(--r-status-2-font);line-height:1.05;margin:0">status-2</p></div>
  <div class="r-divider-3 region chrome" data-region="divider-3"><!-- One blue index strip, rounded trailing edge; selected strip advances left. --></div>
  <div class="r-game-3 region text" data-region="game-3"><!-- Revelaciones; selectable game name with a coherent icon on its left. --><p style="font-size:var(--r-game-3-font);line-height:1.05;margin:0">game-3</p></div>
  <div class="r-status-3 region text" data-region="status-3"><!-- Próximamente; status of the game. --><p style="font-size:var(--r-status-3-font);line-height:1.05;margin:0">status-3</p></div>
  <div class="r-divider-4 region chrome" data-region="divider-4"><!-- One green index strip, rounded trailing edge; selected strip advances left. --></div>
  <div class="r-game-4 region text" data-region="game-4"><!-- Buscando perlas; selectable game name with a coherent icon on its left. --><p style="font-size:var(--r-game-4-font);line-height:1.05;margin:0">game-4</p></div>
  <div class="r-status-4 region text" data-region="status-4"><!-- Próximamente; status of the game. --><p style="font-size:var(--r-status-4-font);line-height:1.05;margin:0">status-4</p></div>
  <div class="r-divider-5 region chrome" data-region="divider-5"><!-- One violet index strip, rounded trailing edge; selected strip advances left. --></div>
  <div class="r-game-5 region text" data-region="game-5"><!-- Trivia; selectable game name with a coherent icon on its left. --><p style="font-size:var(--r-game-5-font);line-height:1.05;margin:0">game-5</p></div>
  <div class="r-status-5 region text" data-region="status-5"><!-- Próximamente; status of the game. --><p style="font-size:var(--r-status-5-font);line-height:1.05;margin:0">status-5</p></div>
  <div class="r-acetate region chrome" data-region="acetate"><!-- Translucent panel with softly raised edges and punched margin; selected game details. --></div>
  <figure class="r-brush region plate" data-region="brush"><img src="../../../assets/plates/brush.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-preview-title region text" data-region="preview-title"><!-- Jeopardy; white chunky title with dark blue outline. --><p style="line-height:1.05;margin:0">preview-title</p></div>
  <div class="r-preview-status region text" data-region="preview-status"><!-- Próximamente; ink blue label on a yellow background. --><p style="font-size:var(--r-preview-status-font);line-height:1.05;margin:0">preview-status</p></div>
  <figure class="r-stage region plate" data-region="stage"><img src="../../../assets/plates/stage.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-preview-help region text" data-region="preview-help"><!-- Estamos preparando este juego. --><p style="font-size:var(--r-preview-help-font);line-height:1.05;margin:0">preview-help</p></div>
  <div class="r-preference-paper region chrome" data-region="preference-paper"><!-- Ivory paper slip underneath the acetate panel, with punched left margin. --></div>
  <div class="r-preference-label region text" data-region="preference-label"><!-- Modalidad preferida (opcional). --><p style="font-size:var(--r-preference-label-font);line-height:1.05;margin:0">preference-label</p></div>
  <div class="r-preference-select region control" data-region="preference-select"><!-- Native select, dark blue border and cream fill; Sin preferencia.: rebuild the control's chrome from the crop (comp-spec.mjs --crop preference-select); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-preference-help region text" data-region="preference-help"><!-- La modalidad se elegirá dentro de cada juego. --><p style="font-size:var(--r-preference-help-font);line-height:1.05;margin:0">preference-help</p></div>
  <div class="r-footer-note region text" data-region="footer-note"><!-- LAS MISMAS PREGUNTAS MÁS PERSONAS MÁS VIDA; handwritten blue note. --><p style="font-size:var(--r-footer-note-font);font-family:var(--r-footer-note-family),sans-serif;font-weight:var(--r-footer-note-weight);line-height:1.05;margin:0">footer-note</p></div>
</main>
</body>
</html>
